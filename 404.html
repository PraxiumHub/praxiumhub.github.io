<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var langs = ["en", "ko", "ja"], l;
      try { l = localStorage.getItem("lang"); } catch (e) {}
      if (langs.indexOf(l) < 0) { l = (navigator.language || "en").slice(0, 2).toLowerCase(); }
      if (langs.indexOf(l) < 0) { l = "en"; }
      document.documentElement.lang = l;
    })();
  </script>
  <title data-i18n="nf.title">Page not found — Praxium Hub</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500&family=Noto+Serif+KR:wght@400&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css?v=3">
</head>
<body>
  <main class="doc" style="min-height:80vh;display:flex;align-items:center;text-align:center">
    <div class="wrap">
      <p class="eyebrow">404</p>
      <h1 data-i18n="nf.heading">This part of the tank is empty.</h1>
      <p style="margin:12px 0 32px" data-i18n="nf.text">The page you’re looking for has drifted away.</p>
      <a class="btn btn--primary" href="/" data-i18n="nf.back">Back to Praxium Hub</a>
    </div>
  </main>
  <script src="/assets/js/i18n.js?v=3"></script>
</body>
</html>
